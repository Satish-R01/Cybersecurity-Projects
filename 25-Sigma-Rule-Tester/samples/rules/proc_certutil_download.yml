title: Certutil Used To Download A File
id: 2e8f1a77-9c05-4b3d-a1e6-0d7c5b3f9a03
status: test
description: certutil with urlcache and a web address. It is a known way to download tools without a browser.
author: Satish R
date: 2026/11/28
tags:
  - attack.command_and_control
  - attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\certutil.exe'
    CommandLine|contains|all:
      - 'urlcache'
      - 'http'
  condition: selection
falsepositives:
  - Very rare in normal work
level: medium
