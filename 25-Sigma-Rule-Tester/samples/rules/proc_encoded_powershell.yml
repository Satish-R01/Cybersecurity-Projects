title: Encoded PowerShell Command
id: 5a1c7e02-3b7d-4e0f-9c11-2f6a0d8e1b01
status: stable
description: PowerShell started with a Base64 encoded command. Attackers use it to hide what they run.
author: Satish R
date: 2026/11/28
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_cli:
    CommandLine|contains:
      - ' -enc '
      - ' -encodedcommand '
      - ' -e JAB'
  condition: selection_img and selection_cli
falsepositives:
  - Some admin and deployment scripts
level: high
